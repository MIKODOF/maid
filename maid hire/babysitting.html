<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Babysitting Application</title>
  <link rel="stylesheet" href="babysitting.css" />
</head>
<body>

  <header class="topbar">
    <div class="logo">Saharo Hiring</div>
    <a href="index.html" class="back-btn">← Back to Home</a>
  </header>

  <section class="hero">
    <div class="hero-text">
      <h1>Babysitting</h1>
      <p>
        Fill this form if you can take care of babies and children with patience and care.
      </p>
    </div>
  </section>

  <section class="form-section">
    <div class="form-box">
      <h2>Apply for Babysitting Work</h2>
      <p class="form-note">
        Please fill simple details below.
      </p>

      <form action="https://formspree.io/f/mreozyvn" method="POST">

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="Full Name" placeholder="Enter your full name" required />
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" name="Phone Number" placeholder="Enter your phone number" required />
        </div>

        <div class="form-group">
          <label>Your Age</label>
          <input type="number" name="Age" placeholder="Enter your age" required />
        </div>

        <div class="form-group">
          <label>City / Area</label>
          <input type="text" name="City / Area" placeholder="Enter your city or area" required />
        </div>

        <div class="form-group">
          <label>How many years of experience?</label>
          <input type="text" name="Experience" placeholder="Example: 1 year, 2 years" required />
        </div>

        <div class="form-group">
          <label>What are you expert in?</label>
          <textarea name="Expert In" rows="4"
            placeholder="Example: baby care, playing with kids, feeding, helping in homework"></textarea>
        </div>

        <div class="form-group">
          <label>What work can you do?</label>
          <textarea name="Work You Can Do" rows="4"
            placeholder="Example: feeding, bathing, playing, school help"></textarea>
        </div>

        <div class="form-group">
          <label>Which age group can you handle?</label>
          <select name="Child Age Group" required>
            <option value="">Select option</option>
            <option value="0-1 year">0–1 year</option>
            <option value="1-5 years">1–5 years</option>
            <option value="5-10 years">5–10 years</option>
            <option value="All">All</option>
          </select>
        </div>

        <div class="form-group">
          <label>Can you help in homework?</label>
          <select name="Homework Help" required>
            <option value="">Select option</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
        </div>

        <div class="form-group">
          <label>Which shift can you do?</label>
          <select name="Shift" required>
            <option value="">Select shift</option>
            <option value="Day">Day</option>
            <option value="Night">Night</option>
            <option value="Both">Both</option>
          </select>
        </div>

        <div class="form-group">
          <label>Full time or part time?</label>
          <select name="Work Type" required>
            <option value="">Select work type</option>
            <option value="Full Time">Full Time</option>
            <option value="Part Time">Part Time</option>
            <option value="Both">Both</option>
          </select>
        </div>

        <div class="form-group">
          <label>Can you stay with family if needed?</label>
          <select name="Stay Option" required>
            <option value="">Select option</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
        </div>

        <div class="form-group">
          <label>Languages you can speak</label>
          <input type="text" name="Languages" placeholder="Example: Hindi, Gujarati, Marathi" />
        </div>

        <div class="form-group">
          <label>Anything more you want to tell?</label>
          <textarea name="More Details" rows="4" placeholder="Write here"></textarea>
        </div>

        <button type="submit" class="submit-btn">Submit Form</button>

      </form>
    </div>
  </section>

</body>
</html>
