<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Housemaid Application</title>
  <link rel="stylesheet" href="housemaid.css" />
</head>
<body>

  <header class="topbar">
    <div class="logo">Saharo Hiring</div>
    <a href="index.html" class="back-btn">← Back to Home</a>
  </header>

  <section class="hero">
    <div class="hero-text">
      <h1>Housemaid</h1>
      <p>
        Fill this form if you can help in house cleaning and daily home work.
      </p>
    </div>
  </section>

  <section class="form-section">
    <div class="form-box">
      <h2>Apply for Housemaid Work</h2>
      <p class="form-note">
        Please fill simple details below.
      </p>

      <form action="https://formspree.io/f/xeepjrdr" method="POST">

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="Full Name" placeholder="Enter your full name" required />
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" name="Phone Number" placeholder="Enter your phone number" required />
        </div>

        <div class="form-group">
          <label>Your Age</label>
          <input type="number" name="Age" placeholder="Enter your age" required />
        </div>

        <div class="form-group">
          <label>City / Area</label>
          <input type="text" name="City / Area" placeholder="Enter your city or area" required />
        </div>

        <div class="form-group">
          <label>How many years of experience?</label>
          <input type="text" name="Experience" placeholder="Example: 1 year, 3 years" required />
        </div>

        <div class="form-group">
          <label>What are you expert in?</label>
          <textarea name="Expert In" rows="4" placeholder="Example: floor cleaning, utensils, clothes washing, dusting"></textarea>
        </div>

        <div class="form-group">
          <label>What work can you do?</label>
          <textarea name="Work You Can Do" rows="4" placeholder="Example: sweeping, mopping, utensils, bathroom cleaning, clothes washing"></textarea>
        </div>

        <div class="form-group">
          <label>Can you clean utensils?</label>
          <select name="Utensils Cleaning" required>
            <option value="">Select option</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
        </div>

        <div class="form-group">
          <label>Can you do sweeping and mopping?</label>
          <select name="Sweeping And Mopping" required>
            <option value="">Select option</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
        </div>

        <div class="form-group">
          <label>Can you wash clothes?</label>
          <select name="Clothes Washing" required>
            <option value="">Select option</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
        </div>

        <div class="form-group">
          <label>Can you clean bathroom?</label>
          <select name="Bathroom Cleaning" required>
            <option value="">Select option</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
        </div>

        <div class="form-group">
          <label>Which shift can you do?</label>
          <select name="Shift" required>
            <option value="">Select shift</option>
            <option value="Morning">Morning</option>
            <option value="Evening">Evening</option>
            <option value="Both">Both</option>
          </select>
        </div>

        <div class="form-group">
          <label>Full time or part time?</label>
          <select name="Work Type" required>
            <option value="">Select work type</option>
            <option value="Full Time">Full Time</option>
            <option value="Part Time">Part Time</option>
            <option value="Both">Both</option>
          </select>
        </div>

        <div class="form-group">
          <label>Can you stay with family if needed?</label>
          <select name="Stay Option" required>
            <option value="">Select option</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
        </div>

        <div class="form-group">
          <label>Languages you can speak</label>
          <input type="text" name="Languages" placeholder="Example: Hindi, Gujarati, Marathi" />
        </div>

        <div class="form-group">
          <label>Anything more you want to tell?</label>
          <textarea name="More Details" rows="4" placeholder="Write here"></textarea>
        </div>

        <button type="submit" class="submit-btn">Submit Form</button>
      </form>
    </div>
  </section>

</body>
</html>
